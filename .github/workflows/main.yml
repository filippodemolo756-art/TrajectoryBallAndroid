
name: Build Trajectory Ball APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        run: |
          echo "Files in repository:"
          find . -maxdepth 4 -type f | sort | head -200
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            if [ -f 8ball/settings.gradle ]; then
              echo "ANDROID_DIR=8ball" >> "$GITHUB_ENV"
            elif [ -f 8ball/settings.gradle.kts ]; then
              echo "ANDROID_DIR=8ball" >> "$GITHUB_ENV"
            else
              echo "No Gradle Android project found."
              exit 1
            fi
          else
            echo "ANDROID_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrajectoryBall-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
